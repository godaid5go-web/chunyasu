<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チュンヤスファンタジー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fcfcfc; --win:#1d2c9c; --edge:#ececf4; --edge-d:#7c84b8; --dim:#9aa2d8;
  --gold:#f8d048; --red:#ff7a6a; --grn:#7cf07c; --pur:#cf9cff; --cyan:#7cd8ff; --org:#ffb060;
  --bg:#000; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',monospace;font-size:15px;padding-inline:16px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#game{max-width:460px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:8px;position:relative;min-height:100%}
#screen{display:block;width:100%;height:auto;aspect-ratio:256/176;image-rendering:pixelated;background:#000;touch-action:manipulation}
#panel{display:flex;flex-direction:column;gap:8px}
p{margin:0}
.win{background:var(--win);border:3px solid var(--edge);border-radius:7px;box-shadow:inset 0 0 0 1px var(--edge-d),0 0 0 1px #000;padding:8px 12px;color:var(--ink)}
.wt{color:var(--gold);margin-bottom:4px}
.dim{color:var(--dim)}
.gold{color:var(--gold)} .red{color:var(--red)} .grn{color:var(--grn)} .pur{color:var(--pur)} .cyan{color:var(--cyan)} .org{color:var(--org)}
.opts{display:flex;flex-direction:column}
.opt{display:block;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:6px 6px 6px 28px;position:relative;cursor:pointer;border-radius:3px;line-height:1.3}
.opt::before{content:'';position:absolute;left:3px;top:50%;width:20px;height:14px;transform:translateY(-50%);background:var(--hand) no-repeat center/contain;image-rendering:pixelated;opacity:0}
.opt:hover::before,.opt:focus-visible::before,.opt.on::before{opacity:1}
.opt:focus-visible{outline:none}
.opt[disabled]{color:var(--dim);cursor:default}
.opt[disabled]::before{opacity:0!important}
.opt .r{float:right;color:var(--dim)}
button{font-family:inherit}
.btn{font:inherit;cursor:pointer;padding:8px 14px;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}

.msg{min-height:96px;white-space:pre-wrap;line-height:1.75;position:relative;cursor:pointer;padding:10px 14px 18px}
.msg:focus-visible{outline:none}
.more{position:absolute;right:12px;bottom:4px;opacity:0}
.msg.done .more{opacity:1;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.next{width:100%;text-align:center;font:inherit;cursor:pointer;padding:12px}
.next:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.nameform{display:flex;flex-direction:column;gap:8px}
.nmrow{display:flex;gap:8px}
.nmrow input{flex:1;min-width:0;font:inherit;font-size:18px;background:#000;color:var(--ink);border:2px solid var(--edge-d);border-radius:4px;padding:6px 10px;-webkit-user-select:text;user-select:text}
.nmrow input:focus{outline:2px solid var(--gold);outline-offset:1px}

.fbar{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 12px}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 4px 0}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);touch-action:none}
.dpad button{background:#26262e;border:2px solid #4a4a58;color:#d8d8e0;font-size:18px;border-radius:7px;cursor:pointer;touch-action:none}
.dpad button:active,.dpad button.hold{background:#3a3a48}
.dpad .c{background:#1a1a20}
.abtn{width:84px;height:84px;border-radius:50%;background:#b8241c;border:3px solid #5a0c08;color:#fff;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #3a0806}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a0806}
.abtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.keys{font-size:12px;color:#6c7098;text-align:center}

.brow{display:grid;grid-template-columns:1fr 1.15fr;gap:6px}
.names{padding:6px 8px;min-height:104px}
.names .opt{padding:4px 4px 4px 26px;font-size:14px}
.names .opt.tgt{color:var(--gold)}
.names .opt.tgt::before{opacity:1;animation:blink .6s steps(1) infinite}
.stat{padding:6px 10px;font-size:14px;line-height:1.55;min-height:104px}
.bar{height:6px;background:#000;border:1px solid var(--edge-d);margin:2px 0 3px}
.bar i{display:block;height:100%;background:var(--grn)}
.bar.low i{background:var(--red)}
.en{color:var(--gold);letter-spacing:2px}
.hand{display:flex;gap:6px;overflow-x:auto;padding:12px 4px 6px;min-height:132px;align-items:flex-start;scrollbar-width:thin}
.bbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;position:sticky;bottom:0;z-index:4;background:var(--bg);padding:6px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 10px -6px rgba(0,0,0,.6)}
.bbar>div:first-child{flex:1 1 100%}
.bbar>div:last-child{margin-left:auto}
.piles{font-size:12px;color:var(--dim)}
.hint{font-size:13px;color:var(--gold);min-height:1.3em}

.card{flex:1 0 66px;max-width:96px;min-height:112px;background:var(--win);border:2px solid var(--edge);border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge-d);padding:10px 6px 6px;display:flex;flex-direction:column;gap:4px;position:relative;text-align:left;color:var(--ink);font:inherit;transition:transform .12s}
button.card{cursor:pointer}
button.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card .cost{position:absolute;top:-9px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3a2400;display:grid;place-items:center;font-size:13px;border:2px solid #000}
.card .cn{font-size:12px;line-height:1.25;letter-spacing:-.3px}
.card.skl .cn{color:var(--cyan)}
.card.pow .cn{color:#f8a0ff}
.card.unc{border-color:#6ab8ff}
.card.rare{border-color:var(--gold);box-shadow:inset 0 0 0 1px #8a6a10,0 0 6px rgba(248,208,72,.45)}
.card.up .cn{color:var(--grn)}
.card .cd{font-size:11px;color:#dfe3ff;line-height:1.4}
.card .ct{margin-top:auto;font-size:10px;color:var(--dim)}
.card .prc{position:absolute;bottom:-9px;right:-6px;background:#2a1c00;color:var(--gold);border:1px solid var(--gold);border-radius:9px;padding:0 6px;font-size:11px}
.card .cnt{position:absolute;top:-9px;right:-6px;background:#000;border:1px solid var(--edge-d);border-radius:9px;padding:0 6px;font-size:11px}
.card.sel{transform:translateY(-10px);border-color:var(--gold)}
.card.no{opacity:.45}
.card.big{max-width:none;width:150px;flex:none;min-height:150px;padding:14px 10px 10px}
.card.big .cn{font-size:16px}.card.big .cd{font-size:13px}.card.big .ct{font-size:11px}

#ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:center;padding:12px 0;z-index:5;overflow:auto}
#ov[hidden]{display:none}
.ovwin{display:flex;flex-direction:column;gap:10px}
.ovwin .cgrid~.opts{position:sticky;bottom:-12px;z-index:3;background:var(--win);margin:0 -12px -8px;padding:8px 12px 10px;border-top:2px solid var(--edge);box-shadow:0 -6px 10px -4px rgba(0,0,0,.55)}
.ovt{color:var(--gold);white-space:pre-wrap;line-height:1.6}
.sub{font-size:13px;color:var(--dim);line-height:1.6}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px;padding-top:10px}
.cgrid .card{max-width:none}
.one,.cmp{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:8px}
.cmp .card{flex:0 1 130px;max-width:130px;min-height:130px}
.arr{color:var(--gold)}
.row2{flex-direction:row;flex-wrap:wrap}
.row2 .opt{width:auto;flex:1 1 120px}
.talk{display:flex;gap:10px;align-items:flex-start}
.ptr{width:96px;height:96px;flex:none;image-rendering:pixelated;border:2px solid var(--edge-d);border-radius:4px;background:#101830}
@media (max-width:380px){.ptr{width:72px;height:72px}}
.menu{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px}
.mstat{grid-row:1 / span 2;display:flex;gap:12px;align-items:flex-start;line-height:1.7;min-width:0}
.port{width:48px;height:48px;image-rendering:pixelated;margin-top:4px}
.mcmd{min-width:150px}
.mgil{text-align:right}
.note{display:block;font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.mgoal{grid-column:1 / span 2;font-size:13px;line-height:1.6}
.slot{display:flex;gap:8px;justify-content:center;margin:10px 0}
.slot span{width:60px;height:68px;background:#fcfcf0;border:3px solid var(--gold);border-radius:6px;display:grid;place-items:center;font-size:34px;font-weight:bold}
.paytbl{font-size:12px;color:var(--dim);line-height:1.6}
.how{font-size:12.5px;line-height:1.7}
.how ul{margin:0;padding-left:1.1em}
.fin{text-align:center;line-height:1.9}
.fin .opts{text-align:left}
textarea.code{width:100%;min-height:110px;font:12px/1.4 ui-monospace,monospace;background:#000;color:var(--ink);border:2px solid var(--edge-d);border-radius:4px;padding:8px;-webkit-user-select:text;user-select:text;resize:vertical}
.err{color:var(--red);font-size:13px;min-height:1.2em}
@media (max-width:380px){.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}.abtn{width:72px;height:72px}.mcmd{min-width:128px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.msg.done .more,.names .opt.tgt::before{animation:none}}
</style>
</head>

 if(B.after){const f=B.after;return f()}
 let moved=false;if(PL.floor==='BF'){const n=B.killed.filter(e=>e.def.cauli).length;if(n){const s0=stageOf(PL.front||0);PL.front=(PL.front||0)+n;moved=stageOf(PL.front)>s0}}
 for(const e of B.killed){const d=e.def.eqDrop;if(d&&!owns(d.id)&&Math.random()<d.rate)await gainEquip(d.id,`${e.name}が なにかを おとした！`)}
 PL.grace=3;FX={type:'in',t0:now(),d:300};toField();
 if(boss){PL.flags.boss=true;lock=true;await ovMsg('レインボーラジの むこうで\nなにかが あわく ひかっている……');lock=false}
 if(moved){lock=true;sfx('enc');FX={type:'flash',t0:now()};await wait(500);FX=null;await ovMsg('ゴゴゴゴゴ……！\nホテルベジタブルが うごいた！\nみどりの りょういきが ひろがった！');const w=[28,33,38][stageOf(PL.front)];if(PL.x>=w-1)PL.x=w-2;lock=false}
 else if(PL.floor==='BF'&&B.killed.some(e=>e.def.cauli)){updHud()}}
async function upgradeFlow(){
 for(;;){const g=groups(PL.deck,c=>!c.up);
  if(!g.length){await say('きたえられる カードが もう ない！');return}
  const i=await pickCard('レベルアップ！ きたえる カードを 1まい えらぶ',g);
  const c=g[i].list[0];const cu={...c,up:true};
  const k=await new Promise(res=>{openOv(`<div class="win ovwin"><p class="ovt">この カードを きたえますか？</p><div class="cmp">${cardHTML(c)}<span class="arr">▶</span>${cardHTML(cu)}</div><div class="opts row2"><button class="opt" data-a="1">きたえる</button><button class="opt" data-a="0" data-cancel>えらびなおす</button></div></div>`);
   ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sfx('cur');closeOv();res(b.dataset.a==='1')})});
  if(k){c.up=true;sfx('lv');await say(`${CARDS[c.id].name}は ${cname(c)}に なった！`);return}}}
function dropFlow(e){return offerCard({uid:PL.uid++,id:e.def.drop,up:false},`${e.name}は カードを おとしていった！`)}
async function defeat(){if(B&&B.lose){const f=B.lose;B.lose=null;B.busy=true;return f()}B.busy=true;renderBattleUI();await wait(600);sfx('bad');
 FX={type:'fade',t0:now(),d:600};await wait(650);FX=null;scene='over';
 await say(`${PL.name}は ちからつきた…`);
 const sv=loadGame();
 const i=await choose('GAME OVER',sv?['きろくから やりなおす','タイトルへ']:['タイトルへ']);
 if(sv&&i===0)resumeFrom(sv);else toTitle();}

/* ---------- story ---------- */
async function altarScene(){scene='altar';PRO={};FX={type:'in',t0:now(),d:600};sfx('daizu');
 await sayAll([
  '……よくぞ ここまで きた。\nわたしは かぜのだいず。',
  'この せかい おにそいワールドは、\nおにと だいずの きんこうに よって たもたれている。',
  'だが いま おにの ちからが ぼうそうし、\nせかいの きんこうが くずれようと している……',
  `${PL.name}よ、おまえに わたしの ちからを さずけよう。`,
  'のこる 3つの だいずを さがし、\nおにの ちからを うちやぶってくれ……']);
 PRO.flash=now();sfx('lv');PL.flags.daizu=true;
 await say(`${PL.name}は かぜのだいずの ちからを うけついだ！`);
 await gainEquip('kaze');
 FX={type:'fade',t0:now(),d:500};await wait(550);
 PL.floor='A1';PL.x=2;PL.y=8;PL.dir='right';PL.grace=4;saveGame();toField();FX={type:'in',t0:now(),d:900};
 lock=true;await ovMsg(`まぶしい ひかりが ${PL.name}を つつんだ。\n……ちじょうに でた！\nここは A国の はまべ、アワニわん。`);lock=false;}

/* ---------- title & prologue ---------- */
function toTitle(){scene='title';closeOv();const sv=loadGame();
 panel.innerHTML=`<div class="win"><div class="opts"><button class="opt" id="tNew">はじめから</button><button class="opt" id="tCont" ${sv?'':'disabled'}>つづきから${sv?`<span class="r">${esc(sv.name)} Lv${sv.lv}</span>`:''}</button><button class="opt" id="tImp">ファイルから よみこむ</button></div></div>
 <div class="win how"><p class="wt">あそびかた</p><ul>
 <li>フィールドを あるくと まものに であう。いずみで かいふく＆きろく。</li>
 <li>たたかいは カードバトル。まいターン 5まい ひいて、マナ3で カードを つかう。</li>
 <li>てきの あたまの マークが つぎの こうどう。ブロックで ダメージを ふせごう。</li>
 <li>レベルアップで HP・こうげき・ぼうぎょが あがり、カードの ダメージや ブロックも ふえる。</li>
 <li>レベルアップで カードを 1まい きたえる（＋）。</li>
 <li>たたかいで カードを ながおし すると、くわしい せつめいが みられる。</li>
 <li>まものは たまに じぶんの ワザを カードとして おとす。いれるかは じゆう。</li>
 <li>もちものは デッキ・そうび（5わく）・アイテム（3わく）の 3つ。</li>
 <li>たからばこや みせの カード・そうびは まいかい ランダム。いらない ものは しょうにんに うれる。</li>
 <li>メニューの「かきだす」で セーブを ファイルに ほぞん できる。</li></ul></div>`;
 $('#tNew').onclick=()=>{ac();sfx('ok');prologue()};
 $('#tCont').onclick=()=>{ac();sfx('ok');const p=loadGame();if(p)resumeFrom(p)};
 $('#tImp').onclick=async()=>{ac();sfx('cur');const p=await importSave();if(p)resumeFrom(p);else $('#tImp').focus({preventScroll:true})};
 $('#tNew').focus({preventScroll:true});}
let proAdv=null;
function proPage(text,nameEntry){return new Promise(res=>{PRO={text,t0:now()};
 if(nameEntry){
  panel.innerHTML=`<form class="win nameform" id="nmf"><p class="wt">なまえを いれてください</p><div class="nmrow"><input id="nm" maxlength="6" autocomplete="off" value="チュンヤス" aria-label="なまえ"><button class="win btn" type="submit">けってい</button></div><p class="sub">6もじまで</p></form>`;
  const inp=$('#nm');setTimeout(()=>{inp.focus({preventScroll:true});inp.select()},50);
  $('#nmf').onsubmit=e=>{e.preventDefault();const v=inp.value.trim().slice(0,6);sfx('ok');proAdv=null;res(v||'チュンヤス')};
 }else{
  panel.innerHTML=`<button class="win next" id="proN">▼ つぎへ</button>`;
  const go=()=>{if(now()-PRO.t0<300)return;sfx('cur');proAdv=null;res()};proAdv=go;$('#proN').onclick=go;$('#proN').focus({preventScroll:true});
 }});}
async function prologue(){scene='prologue';closeOv();
 await proPage('ここは　きょうらんと　こんとんのせかい\nおにそいワールド');
 await proPage('そんな　まきょうに　まよいこんでしまった\nおろかものが　ひとり');
 const name=await proPage('そのなは…',true);
 PL=newPlayer(name);
 await proPage(`${PL.name}は　ひまなので\nどうくつたんけんに　でかけ\nまいごに　なってしまった`);
 FX={type:'fade',t0:now(),d:400};await wait(420);
 saveGame();FX={type:'in',t0:now(),d:700};toField();}

/* ---------- input ---------- */
function focusMove(root,k){const opts=[...root.querySelectorAll('button:not([disabled])')];if(!opts.length)return;let i=opts.indexOf(document.activeElement);
 i=(k==='ArrowDown'||k==='ArrowRight')?(i+1)%opts.length:(i<=0?opts.length-1:i-1);opts[i].focus({preventScroll:true});sfx('cur');}
document.addEventListener('keydown',e=>{const k=e.key;const tg=e.target;
 if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;
 if(sayState&&(k==='Enter'||k===' '||k==='z'||k==='Z')){e.preventDefault();sayState();return}
 if(!ov.hidden){if(k.startsWith('Arrow')){e.preventDefault();focusMove(ov,k)}if(k==='Escape'){const c=ov.querySelector('[data-a=close],[data-cancel]');c&&c.click()}return}
 if(scene==='prologue'&&proAdv&&(k==='Enter'||k===' '||k==='z'||k==='Z')){e.preventDefault();proAdv();return}
 if(scene==='field'){const d=KEYDIR[k];if(d){e.preventDefault();keyHeld=d;return}if(k==='Escape'||k==='m'||k==='M')openMenu();return}
 if(scene==='battle'){if(/^[1-9]$/.test(k))handCard(+k-1);else if(k==='e'||k==='E')endTurn();else if(k==='Escape'&&B){B.sel=null;hint('');renderBattleUI()}return}
 if(k.startsWith('Arrow')){e.preventDefault();focusMove(panel,k)}});
document.addEventListener('keyup',e=>{if(KEYDIR[e.key]&&KEYDIR[e.key]===keyHeld)keyHeld=null});
window.addEventListener('blur',()=>{keyHeld=null;held=null});
let DBGN=0,DBGT=0;
cv.addEventListener('pointerdown',ev=>{
 if(scene==='title'&&ov.hidden){const t=now();DBGN=t-DBGT<1500?DBGN+1:1;DBGT=t;if(DBGN>=7){DBGN=0;sfx('lv');debugStart()}return}
 if(scene==='prologue'&&proAdv){proAdv();return}
 if(scene!=='battle'||!B||B.busy||B.sel===null)return;const r=cv.getBoundingClientRect();
 const x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
 const e=alive().filter(e=>Math.abs(x-e.cx)<e.size/2+8&&Math.abs(y-e.cy)<e.size/2+10).sort((a,b)=>Math.hypot(x-a.cx,y-a.cy)-Math.hypot(x-b.cx,y-b.cy))[0];if(e)playCard(B.sel,e);});

/* ---------- boot ---------- */
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({pl:(PL&&scene==='field')?JSON.parse(JSON.stringify(PL)):null}))}catch(e){}
function start(data){const p=data&&data.pl?sanitize(data.pl):null;if(p){PL=p;toField()}else toTitle()}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load(`12px DotGothic16`).catch(()=>{});
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
</body>
